[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-legal-drift"
version = "0.6.0"
description = "Connected Phase 0-11 research platform for Temporal Legal Drift in the Indian Code"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Temporal Legal Drift research team" }]
dependencies = []

[project.optional-dependencies]
dev = []
# Exact pin: pypdf text output changes between releases; 6.16.2 regenerates 99/100 frozen normalized docs.
pdf = ["pypdf==6.16.2"]
rag = ["chromadb>=0.5"]

[project.scripts]
tldrift = "temporal_legal_drift.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["temporal_legal_drift"]
