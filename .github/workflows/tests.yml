name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase-0-11:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Validate research contract
        run: tldrift validate-contract
      - name: Check Phase 0-11 engineering gates
        run: tldrift check-gates
      - name: Run Phase 0-11 tests
        run: python -m unittest discover -s tests -v

  rag-integration:
    runs-on: ubuntu-latest
    env:
      # Keep retrieval deterministic and offline; the live India Code lookup is a
      # runtime supplement, not part of the tested contract.
      TLD_LIVE_INDIA_CODE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with PDF extras
        run: python -m pip install -e '.[pdf]'
      - name: Build the RAG retrieval corpus offline
        run: |
          tldrift rehydrate-raw-store --manifest configs/corpus/rag_corpus.v1.json
          tldrift normalize-corpus    --manifest configs/corpus/rag_corpus.v1.json
      - name: Run RAG retrieval tests
        run: python -m unittest tests.unit.test_rag tests.unit.test_webapp -v
