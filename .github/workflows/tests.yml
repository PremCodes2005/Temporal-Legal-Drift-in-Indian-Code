name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase-0-7:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Validate research contract
        run: tldrift validate-contract
      - name: Check Phase 0-7 engineering gates
        run: tldrift check-gates
      - name: Run Phase 0-7 tests
        run: python -m unittest discover -s tests -v
