name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase-0-11:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Restore hash-verified release inputs
        run: tldrift restore-release-inputs
      - name: Validate research contract
        run: tldrift validate-contract
      - name: Check Phase 0-11 engineering gates
        run: tldrift check-gates
      - name: Run Phase 0-11 tests
        run: python -m unittest discover -s tests -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Build production assets
        run: npm run build
        working-directory: frontend
      - name: Built assets must match committed web/
        run: git diff --exit-code -- web && test -z "$(git status --porcelain -- web)"
